<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>BomLens social card (Korean)</title>
<!--
  Source for docs/images/og-card-ko.png, the Open Graph card the docs site uses
  (docs-site/src/components/Head.astro).

  Render it with:  npm run capture:og   (in docker/web/frontend)
  which screenshots this file at 1200x630 through tests/ui/og-card.spec.ts.
  The fonts come from the frontend's node_modules, so run npm ci there first.
  The English and Korean cards share one layout; only the text and the face differ.

  Keep the wording in step with the Korean home page.
-->
<style>
  @font-face {
    font-family: "Pretendard Variable";
    font-weight: 45 920;
    src: url("../../../docker/web/frontend/node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
  }
  :root { --brand: #1d4ed8; --ink: #1f2328; --muted: #59636e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #ffffff;
    font-family: "Pretendard Variable", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  .bar { height: 14px; background: var(--brand); }
  .body { flex: 1; padding: 76px 90px 56px; display: flex; flex-direction: column; }
  .logo { display: block; height: 112px; width: auto; align-self: flex-start; }
  .tagline {
    margin-top: 64px;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.32;
    color: var(--ink);
    white-space: nowrap;
  }
  .tagline em { font-style: normal; color: var(--brand); }
  .footer { margin-top: auto; font-size: 24px; color: var(--muted); }
  .footer strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="body">
    <img class="logo" src="../logo.svg" alt="BomLens" />
    <p class="tagline">
      로컬에서 <em>SBOM 생성</em>과<br />
      오픈소스 위험 평가를 한 번에
    </p>
    <p class="footer"><strong>github.com/sktelecom/bomlens</strong> &nbsp;&middot;&nbsp; CLI &amp; 웹 UI &nbsp;&middot;&nbsp; Apache-2.0</p>
  </div>
</body>
</html>
