<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BomLens social card</title>
<!--
  Source for docs/images/og-card.png, the Open Graph card the docs site uses
  (docs-site/src/components/Head.astro).

  Render it with:  npm run capture:og   (in docker/web/frontend)
  which screenshots this file at 1200x630 through tests/ui/og-card.spec.ts.
  The fonts come from the frontend's node_modules, so run npm ci there first.
  The English and Korean cards share one layout; only the text and the face differ.

  Keep the wording in step with the repository description and the README opening line; keep the URL in step with the repository name.
-->
<style>
  @font-face {
    font-family: "Inter";
    font-weight: 700;
    src: url("../../../docker/web/frontend/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-weight: 500;
    src: url("../../../docker/web/frontend/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2") format("woff2");
  }
  :root { --brand: #1d4ed8; --ink: #1f2328; --muted: #59636e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #ffffff;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  .bar { height: 14px; background: var(--brand); }
  .body { flex: 1; padding: 76px 90px 56px; display: flex; flex-direction: column; }
  .logo { display: block; height: 112px; width: auto; align-self: flex-start; }
  .tagline {
    margin-top: 64px;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.32;
    color: var(--ink);
    white-space: nowrap;
  }
  .tagline em { font-style: normal; color: var(--brand); }
  .footer { margin-top: auto; font-size: 24px; color: var(--muted); }
  .footer strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="body">
    <img class="logo" src="../logo.svg" alt="BomLens" />
    <p class="tagline">
      A <em>local-first SBOM generator</em> and<br />
      open-source risk assessor.<br />
      CycloneDX SBOM, notice, and security report. No SaaS.
    </p>
    <p class="footer"><strong>github.com/sktelecom/bomlens</strong> &nbsp;&middot;&nbsp; CLI &amp; web UI &nbsp;&middot;&nbsp; Apache-2.0</p>
  </div>
</body>
</html>
