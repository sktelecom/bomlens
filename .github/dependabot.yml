version: 2
updates:
  # GitHub Actions, pinned to SHAs in the workflows. Dependabot bumps the SHA and
  # the version comment. Minor/patch are grouped; majors come as separate PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor:
        update-types: [minor, patch]
    ignore:
      # Action majors are pinned to SHAs; bump them deliberately, not automatically.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Electron desktop app. Hold majors (electron/electron-builder) for a deliberate,
  # tested bump; batch the rest.
  - package-ecosystem: npm
    directory: /electron
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      electron-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Web UI (React SPA). Batch minor/patch; hold majors for a deliberate bump.
  - package-ecosystem: npm
    directory: /docker/web/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      frontend-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # @playwright/test is coupled to the pinned mcr.microsoft.com/playwright
      # container the visual-regression and guide-screenshot jobs run in
      # (.github/workflows/ci.yml, docker/web/frontend/README.md): the image bakes
      # the matching browser build, so a bump here without moving the image tag in
      # lockstep breaks with "Executable doesn't exist". Hold even minor/patch for a
      # deliberate, baseline-reseeded upgrade rather than batching it with cosmetic
      # font/CSS deps.
      - dependency-name: "@playwright/test"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  # Base images for the post-process scanner image. Hold base-image majors
  # (e.g. node, python) for a deliberate, tested bump.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Base images for the Android SDK images.
  - package-ecosystem: docker
    directory: /docker/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
