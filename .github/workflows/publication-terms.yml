name: Publication terms

# Keeps commercial product names, and measurements taken against such products,
# out of what this repository publishes — the tracked files, the commit messages
# and the pull request's own title and body.
#
# The list of terms is deliberately NOT here. An earlier version of this check
# lived in this repository and had to carry the names it looks for, which
# published exactly what it exists to keep out. The check and its patterns now
# live in private tooling that this workflow fetches at run time, and the run
# prints only the file and line of anything it finds: the logs of a public
# repository are public, so printing the matching text would repeat the same
# mistake in a different place. To see what was matched, run the check locally
# from a checkout of that tooling.
#
# A pull request from a fork cannot reach the tooling — GitHub withholds secrets
# from fork workflows — so the check reports that it did not run rather than
# passing quietly. That is an acceptable gap: the restriction this enforces
# attaches to what we publish, and our own work arrives on branches of this
# repository rather than through forks.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    name: Publication terms
    runs-on: ubuntu-latest
    steps:
      - name: Determine whether the private tooling is reachable
        id: tooling
        env:
          TOOLS_REPO: ${{ secrets.INTERNAL_TOOLS_REPO }}
          TOOLS_TOKEN: ${{ secrets.INTERNAL_TOOLS_TOKEN }}
        run: |
          if [ -n "$TOOLS_REPO" ] && [ -n "$TOOLS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report that the check could not run
        if: steps.tooling.outputs.available != 'true'
        run: |
          echo "::warning title=Publication terms not checked::This run could not \
          reach the private tooling that holds the check, which is expected for a \
          pull request from a fork. A maintainer has to run the check before merging."
          echo "The publication-terms check did NOT run on this revision."

      - name: Checkout repository
        if: steps.tooling.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Checkout the private tooling
        if: steps.tooling.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.INTERNAL_TOOLS_REPO }}
          token: ${{ secrets.INTERNAL_TOOLS_TOKEN }}
          path: .publication-tooling
          persist-credentials: false

      - name: Tracked files
        if: steps.tooling.outputs.available == 'true'
        run: |
          bash .publication-tooling/tools/check-publication-terms.sh --locations-only

      - name: Commit messages in this pull request
        if: steps.tooling.outputs.available == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .publication-tooling/tools/check-publication-terms.sh \
            --locations-only --commits "$BASE_SHA..$HEAD_SHA"

      - name: Pull request title and body
        if: steps.tooling.outputs.available == 'true' && github.event_name == 'pull_request'
        env:
          # Through the environment, never interpolated into the script: a title
          # is attacker-controlled text on a public repository.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr-text.txt"
          bash .publication-tooling/tools/check-publication-terms.sh \
            --locations-only --text "$RUNNER_TEMP/pr-text.txt"
