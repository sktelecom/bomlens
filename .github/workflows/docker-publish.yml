name: Build and Publish Docker Images

# Two-stage architecture: we build only the images cdxgen does NOT provide —
#   (1) the lightweight post-process image (bomlens; sbom-generator/sbom-scanner aliases)
#   (2) Android SDK images — built by each user, never published (see below)
# All language SBOM generation uses cdxgen's official images (pulled on-demand),
# so they are NOT built here.

on:
  push:
    branches:
      - main          # publish :latest so `--ui` (default image) tracks main
    tags:
      - 'v*.*.*'
    paths:            # only rebuild when image content changes (not docs-only)
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'
  release:            # paths do NOT apply to release/dispatch — versioned
    types: [ published ]   # publishes always run regardless of changed files
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to registry?'
        required: true
        type: boolean
        default: false
      skip_scan:
        description: 'Skip the pre-publish image scan (only for a scanner outage that is blocking a release)'
        required: false
        type: boolean
        default: false
  # Callable from another repository so the build can run on that repository's
  # runners while the images keep this one's name and signing identity: the
  # Sigstore certificate subject is built from the called workflow's ref, not
  # the caller's. `owner` retargets the image names; leaving it empty keeps the
  # current behaviour, so a fork that calls this without it still publishes
  # under its own account.
  workflow_call:
    inputs:
      owner:
        description: 'Registry namespace to publish under (default: this repository owner)'
        required: false
        type: string
        default: ''
      push:
        description: 'Push images to the registry'
        required: false
        type: boolean
        default: false
      skip_scan:
        description: 'Skip the pre-publish image scan'
        required: false
        type: boolean
        default: false
      version:
        description: >-
          Release version the semver tags come from, e.g. v1.11.7. A caller is
          not on a tag of its own, and without this the images would be tagged
          only latest and sha-, leaving no 1.11.7 for the desktop app to pull.
          Empty keeps the ref as the source, which is what a tag push wants.
        required: false
        type: string
        default: ''
    secrets:
      PUBLISH_TOKEN:
        description: 'Token with packages:write on the target namespace (default: the run GITHUB_TOKEN)'
        required: false

env:
  REGISTRY: ghcr.io
  PUBLISH_OWNER: ${{ inputs.owner || github.repository_owner }}
  IMAGE_NAME: ${{ inputs.owner || github.repository_owner }}/sbom-scanner

# Least-privilege default; jobs that publish images opt into packages: write below.
permissions:
  contents: read

# A concurrency GROUP is scoped per repository, so this can never collide
# across a fork's own workflow_call and the org repository's own direct tag
# push -- those are different repositories' Actions namespaces entirely.
# Keyed by the actual publish OWNER (not just version/ref): a rehearsal tag
# push on the fork and a release-upstream.yml dispatch are both runs of this
# workflow on the fork's runners, but they publish to different namespaces
# (the rehearsal defaults to the fork's own owner; the dispatch explicitly
# sets `owner: sktelecom`) -- keying on version/ref alone would serialize two
# builds that push nowhere near each other, and that exact rehearsal-then-
# dispatch sequence is this project's own documented release procedure. What
# this DOES still catch: two dispatches to the same owner and version
# overlapping, which would otherwise both try to build and push the same
# images at once. No cancel-in-progress -- the second one queues behind the
# first rather than cancelling a signing step partway through.
#
# Side effect on the plain `push: branches: [main]` trigger (no version
# input there, so the group is docker-publish-<owner>-main): consecutive
# pushes to main now queue on this same group instead of running in
# parallel, and if a third push arrives while one run is already queued
# behind another, GitHub replaces that still-pending run rather than queuing
# a second one. :latest ends up built from whichever push actually ran last
# either way, so the outcome is correct, just serialized.
concurrency:
  group: docker-publish-${{ inputs.owner || github.repository_owner }}-${{ inputs.version || github.ref_name }}

jobs:
  # ---------------------------------------------------------------
  # (1) Post-process image: syft + Trivy + cosign + notice + UI
  # ---------------------------------------------------------------
  build-postprocess:
    name: Build post-process image
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    # No timeout existed here before (360-minute platform default). Measured
    # on a real successful run: "Build and push" alone took 24 minutes, on
    # top of the separate amd64 gate build, Trivy DB download + image scan +
    # config scan, syft install + multi-arch attest, the SBOM attached to the
    # release, the Dockerfile SARIF scan, a re-pull for the published-image
    # scan, and two SARIF uploads -- all in this one job. 45 minutes is
    # tight against a cache-cold run; 90 gives real margin.
    timeout-minutes: 90
    permissions:
      contents: write   # attach the image SBOM to the release
      id-token: write   # keyless cosign signing (Sigstore OIDC)
      packages: write
      security-events: write   # upload-sarif below needs this, or it fails
                                # silently under continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Resolve the publish flag once and reuse it for push, signing, and attest.
      - name: Resolve publish flag
        id: flags
        run: echo "push=${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.push == true || github.ref == 'refs/heads/main') }}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # Co-publish under three names from a single build (same digest):
          #   bomlens          — featured name, the product brand
          #   sbom-generator   — alias, kept for the prior featured name
          #   sbom-scanner     — legacy name, kept so existing supplier pulls never break
          images: |
            ${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/bomlens
            ${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/sbom-generator
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # metadata-action's `version` output is the literal string "latest" for a
      # main-branch build, which tells a reader nothing about which commit is
      # actually running. Swap in the short SHA for that one case so
      # BOMLENS_VERSION (surfaced by /capabilities and the image's OCI label)
      # always names a real commit; a tagged release keeps its clean semver.
      - name: Resolve BOMLENS_VERSION
        id: version
        run: |
          v="${{ steps.meta.outputs.version }}"
          [ "$v" = "latest" ] && v="latest-$(git rev-parse --short HEAD)"
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # --- Publish gate ---------------------------------------------------
      # The registry copy is the one users pull, so the scan has to happen while
      # the image is still local. buildx pushes multi-arch straight from the
      # build, so amd64 is built and loaded first; the gha cache makes that half
      # of the multi-arch build below a cache hit rather than a second build.
      - name: Install Trivy (pinned release tarball)
        run: |
          # Single source of truth: the version pinned in docker/Dockerfile.
          TRIVY_VERSION=$(grep -oP 'ARG TRIVY_VERSION=\K\S+' docker/Dockerfile)
          ver="${TRIVY_VERSION#v}"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${ver}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/trivy.tgz trivy
          trivy --version

      - name: Build amd64 image for the publish gate
        if: inputs.skip_scan != true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            SBOM_SCANOSS=true
            BOMLENS_VERSION=${{ steps.version.outputs.value }}
          tags: bomlens:publish-gate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scope, and why it is this narrow:
      #   --pkg-types os   the distribution layer is what a rebuild can actually
      #                    fix. Findings inside the third-party tool binaries the
      #                    image bundles move when their pinned version moves,
      #                    which Renovate proposes; holding a publish for them
      #                    would put releases on someone else's cadence.
      #   CRITICAL         the severity worth holding a publish for. The
      #                    full-severity picture is uploaded below and swept
      #                    nightly, so nothing is lost by not blocking on it.
      #   --ignore-unfixed a finding with no fix available is not actionable here.
      # A database download failure is infrastructure rather than a finding, so
      # it gets one retry before it is allowed to stop a publish.
      - name: Scan the image before publishing
        if: inputs.skip_scan != true
        run: |
          set -euo pipefail
          trivy image --download-db-only --quiet \
            || { sleep 30; trivy image --download-db-only --quiet; }
          trivy image --quiet --exit-code 1 --severity CRITICAL --ignore-unfixed \
            --pkg-types os --scanners vuln --skip-db-update bomlens:publish-gate

      # The same gate for the build definitions. .trivyignore records the one
      # accepted misconfiguration and the reason for it.
      - name: Scan the build definitions before publishing
        if: inputs.skip_scan != true
        run: trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore ./docker

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.flags.outputs.push == 'true' }}
          # scanoss.py is MIT, so unlike the GPL firmware tools it ships in the base
          # image; --identify-vendored then works out of the box (runtime-gated by
          # the flag). The Dockerfile default stays false for lean local builds.
          build-args: |
            SBOM_SCANOSS=true
            BOMLENS_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          # Override metadata-action's own image.version annotation (which
          # would otherwise say "latest") with the same resolved identifier.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Supply-chain: dogfood our own signing and SBOM on the published image ---
      # The tool offers cosign signing (--sign) and SBOM generation to users; we do
      # the same to our own image. Keyless signatures use the GitHub OIDC token
      # (no key management): OIDC -> Fulcio cert -> Rekor transparency log.
      - name: Install cosign
        if: steps.flags.outputs.push == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v2.6.5
      - name: Install syft (pinned release tarball)
        if: steps.flags.outputs.push == 'true'
        run: |
          # Single source of truth: read the pinned version from docker/Dockerfile
          # (no separate literal to keep in sync).
          SYFT_VERSION=$(grep -oP 'ARG SYFT_VERSION=\K\S+' docker/Dockerfile)
          ver="${SYFT_VERSION#v}"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${ver}_linux_amd64.tar.gz" -o /tmp/syft.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tgz syft
          syft version
      - name: Sign image and attest its SBOM
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        run: |
          set -euo pipefail
          bl="${REGISTRY}/${OWNER}/bomlens@${DIGEST}"
          gen="${REGISTRY}/${OWNER}/sbom-generator@${DIGEST}"
          leg="${REGISTRY}/${OWNER}/sbom-scanner@${DIGEST}"
          cosign sign --yes "$bl"
          cosign sign --yes "$gen"
          cosign sign --yes "$leg"
          # CycloneDX SBOM of our own image, attached as a signed attestation.
          syft "$bl" -o cyclonedx-json=sbom.cdx.json
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$bl"
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$gen"
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$leg"
      - name: Attach image SBOM to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: sbom.cdx.json
        continue-on-error: true

      # The record for the Security tab, at full severity and covering both
      # package types: wider than the publish gate above, and reporting only.
      - name: Scan Dockerfiles with Trivy
        if: github.event_name != 'pull_request'
        run: trivy config --quiet --format sarif --output trivy-config.sarif --exit-code 0 ./docker
      - name: Upload Dockerfile scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: 'trivy-config.sarif'
          category: trivy-config
        continue-on-error: true

      # Scan the actual published image (not just the Dockerfile) for known CVEs.
      - name: Scan published image with Trivy
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        run: trivy image --quiet --format sarif --output trivy-image.sarif --exit-code 0 "${REGISTRY}/${OWNER}/bomlens@${DIGEST}"
      - name: Upload image scan results
        if: steps.flags.outputs.push == 'true'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image
        continue-on-error: true

  # ---------------------------------------------------------------
  # (2) Android SDK images — NOT published.
  #
  # The image adds an Android SDK platform installed by sdkmanager, and the
  # Android SDK is not open source. Its terms (developer.android.com/studio/terms
  # section 3.4) permit copying only for backup and bar redistribution except
  # where a third-party licence requires otherwise, and section 3.5 limits that
  # exception to the SDK's open-source components. Pushing the image to a public
  # registry hands the SDK to everyone who pulls it, which is the thing that
  # clause names.
  #
  # So the build stays in docker/android/Dockerfile and each user builds it
  # once, accepting Google's terms themselves the way they would installing
  # Android Studio. scan-sbom.sh prints the command when the image is missing.
  # Images published before this decision are left in place: pulling one still
  # works, and withdrawing them would break scans on released versions.
  # ---------------------------------------------------------------

  # ---------------------------------------------------------------
  # (3) Firmware image — base + GPL unpack/ID tools (opt-in build).
  #     Published separately so the base image installs no GPL tool of its own
  #     (its Debian base carries GPL system packages regardless).
  # ---------------------------------------------------------------
  build-firmware:
    name: Build firmware image
    # The firmware CVE data comes from a plain git clone of the NVD data feeds
    # plus a local distill (docker/build-cpe-index.py), with no NVD api2 rate
    # limit and no API key, so this doesn't need a cloud IP. (It previously
    # needed a self-hosted runner because NVD throttled the api2 fetch into
    # multi-hour stalls from cloud IPs — that constraint no longer applies,
    # so being back on self-hosted here is incidental, not required.)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    # Measured multi-arch build time varied 23-37 min across runs (GHA cache
    # hit rate for the NVD-feed clone + distill and the arm64 QEMU-emulated
    # layers), plus ~3 min for the arm64 tool/scan smoke test below and the
    # re-pulls (syft attest, Trivy scan) against a small (~0.8 GB) image.
    # 90 min is roughly double the observed worst case.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
      security-events: write   # upload-sarif below needs this, or it fails
                                # silently under continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve publish flag
        id: flags
        run: echo "push=${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.push == true || github.ref == 'refs/heads/main') }}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/bomlens-firmware
            ${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/sbom-scanner-firmware
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Resolve BOMLENS_VERSION
        id: version
        run: |
          v="${{ steps.meta.outputs.version }}"
          [ "$v" = "latest" ] && v="latest-$(git rev-parse --short HEAD)"
          echo "value=$v" >> "$GITHUB_OUTPUT"
      # unblob has an arm64 PyPI wheel, cve-bin-tool and ubi_reader are
      # pure-Python (any arch), and sasquatch/dpkg install already resolve
      # arch via `dpkg --print-architecture`, so this builds both platforms.
      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.flags.outputs.push == 'true' }}
          build-args: |
            SBOM_FIRMWARE=true
            BOMLENS_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=firmware
          cache-to: type=gha,mode=max,scope=firmware
      # The build above only proves the arm64 layers build (buildx's own
      # bundled QEMU runs the RUN steps during the build). Running the built
      # image afterward is a separate mechanism: a plain `docker run` of an
      # arm64 image on this x86_64 runner needs binfmt_misc registered at the
      # kernel level, which setup-qemu-action does for the step below.
      - name: Set up QEMU (for running the built arm64 image, not for the build)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      # Proves the finished image also RUNS its tools under emulation and
      # produces a real result, not just that it builds: --load a single-arch
      # arm64 image from the same cache, check each firmware tool's real
      # entrypoint, then run an actual firmware scan through
      # scripts/scan-sbom.sh against a minimal fixture (mirrors the fixture
      # tests/test-e2e.sh packs for this same job).
      - name: Smoke test arm64 image (emulated tool execution + a real scan)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 --load \
            --build-arg SBOM_FIRMWARE=true \
            --build-arg BOMLENS_VERSION=${{ steps.version.outputs.value }} \
            --cache-from type=gha,scope=firmware \
            -t bomlens-firmware-arm64-smoke \
            ./docker

          echo "::group::tool versions (arm64, emulated)"
          docker run --rm --entrypoint sh bomlens-firmware-arm64-smoke -c '
            set -e
            unblob --version
            sasquatch -version 2>&1 | head -1 || true
            cve-bin-tool --version
            ubireader_extract_files --help >/dev/null
            echo "ubireader_extract_files OK"
          '
          echo "::endgroup::"

          echo "::group::real firmware scan (arm64, emulated)"
          w="$(mktemp -d)"
          mkdir -p "$w/rootfs/var/lib/dpkg" "$w/rootfs/bin" "$w/rootfs/etc"
          printf '%s\n' \
            'Package: zlib1g' \
            'Status: install ok installed' \
            'Architecture: amd64' \
            'Version: 1:1.2.13.dfsg-1' \
            'Description: compression library - runtime' \
            > "$w/rootfs/var/lib/dpkg/status"
          echo "fixture" > "$w/rootfs/bin/busybox"
          echo "NAME=Fixture" > "$w/rootfs/etc/os-release"
          docker run --rm -v "$w":/w --entrypoint mksquashfs bomlens-firmware-arm64-smoke \
            /w/rootfs /w/fw.squashfs -noappend -no-progress
          ( cd "$w" && SBOM_FIRMWARE_IMAGE=bomlens-firmware-arm64-smoke \
              bash "${{ github.workspace }}/scripts/scan-sbom.sh" \
              --project smoke --version 1.0 --target fw.squashfs --generate-only )
          bom="$w/smoke_1.0/smoke_1.0_bom.json"
          jq -e '.bomFormat=="CycloneDX" and .metadata.component.type=="firmware"' "$bom" >/dev/null
          ncomp=$(jq '[.components[]?]|length' "$bom")
          echo "components detected: $ncomp"
          [ "$ncomp" -gt 0 ]
          echo "::endgroup::"
      - name: Install cosign
        if: steps.flags.outputs.push == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v2.6.5
      - name: Sign firmware image
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${OWNER}/bomlens-firmware@${DIGEST}"
          cosign sign --yes "${REGISTRY}/${OWNER}/sbom-scanner-firmware@${DIGEST}"
      # Same supply-chain treatment as the post-process image above: an
      # attached, signed SBOM attestation, not just a bare signature.
      - name: Install syft (pinned release tarball)
        if: steps.flags.outputs.push == 'true'
        run: |
          SYFT_VERSION=$(grep -oP 'ARG SYFT_VERSION=\K\S+' docker/Dockerfile)
          ver="${SYFT_VERSION#v}"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${ver}_linux_amd64.tar.gz" -o /tmp/syft.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tgz syft
          syft version
      - name: Attest firmware image SBOM
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        run: |
          set -euo pipefail
          bl="${REGISTRY}/${OWNER}/bomlens-firmware@${DIGEST}"
          leg="${REGISTRY}/${OWNER}/sbom-scanner-firmware@${DIGEST}"
          syft "$bl" -o cyclonedx-json=sbom-firmware.cdx.json
          cosign attest --yes --predicate sbom-firmware.cdx.json --type cyclonedx "$bl"
          cosign attest --yes --predicate sbom-firmware.cdx.json --type cyclonedx "$leg"
      - name: Install Trivy (pinned release tarball)
        if: steps.flags.outputs.push == 'true'
        run: |
          TRIVY_VERSION=$(grep -oP 'ARG TRIVY_VERSION=\K\S+' docker/Dockerfile)
          ver="${TRIVY_VERSION#v}"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${ver}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/trivy.tgz trivy
          trivy --version
      # Report-only for now (exit-code 0): the base image's own publish gate
      # above already holds the release for a CRITICAL finding in the shared
      # layers. This image adds unblob/cve-bin-tool/ubi_reader on top, whose
      # own CVE posture has not been observed here yet; a first pass with no
      # gate is deliberate so the Security tab shows real numbers before this
      # is (or is not) turned into a second publish gate in a follow-up.
      # --scanners vuln --ignore-unfixed matches nightly.yml's convention for
      # these same four images (see that workflow's own comment), not the
      # older "Scan published image with Trivy" step above for the base
      # image, which predates that convention and is left as-is here.
      - name: Scan published firmware image with Trivy
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        # continue-on-error: this is report-only by design (see above), so a
        # transient failure (DB download, registry re-pull) must not fail a
        # job that already pushed, signed and attested successfully -- least
        # of all this one, whose rebuild is the most expensive of the three.
        continue-on-error: true
        run: trivy image --quiet --scanners vuln --ignore-unfixed --format sarif --output trivy-image-firmware.sarif --exit-code 0 "${REGISTRY}/${OWNER}/bomlens-firmware@${DIGEST}"
      - name: Upload firmware image scan results
        if: steps.flags.outputs.push == 'true'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: 'trivy-image-firmware.sarif'
          category: trivy-image-firmware
        continue-on-error: true

  # (4) AIBOM image — base + OWASP AIBOM Generator for AI-model SBOMs (opt-in
  #     build). Separate image so the base stays lean; the web UI's AI-model
  #     input and scan-aibom.sh use it.
  # ---------------------------------------------------------------
  build-aibom:
    name: Build AIBOM image
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    # This job had no timeout at all before (the 360-minute platform default).
    # Measured on a real successful run: the "Build and push" step alone took
    # 86 minutes (cache export ~41min + arm64 QEMU emulation ~26min + push
    # ~12min + amd64 setup ~7min) -- this is the largest of the four published
    # images by a wide margin (measured compressed: ~3.8 GB, bigger than the
    # main image and both other opt-in images combined), and the only
    # multi-arch one besides the main image. The syft/Trivy steps below each
    # pull it again from the registry on top of that (push does not load it
    # locally), so the realistic total is well over 100 minutes. 180 minutes
    # is a real cap against a genuine hang, not a number picked to look safe
    # against a measurement nobody had yet.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
      security-events: write   # upload-sarif below needs this, or it fails
                                # silently under continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve publish flag
        id: flags
        run: echo "push=${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.push == true || github.ref == 'refs/heads/main') }}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/bomlens-aibom
            ${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/sbom-scanner-aibom
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Resolve BOMLENS_VERSION
        id: version
        run: |
          v="${{ steps.meta.outputs.version }}"
          [ "$v" = "latest" ] && v="latest-$(git rev-parse --short HEAD)"
          echo "value=$v" >> "$GITHUB_OUTPUT"
      # The AIBOM Generator is Python; build multi-arch like the base image. If an
      # arm64 build ever fails on a native dep, drop this to `linux/amd64`.
      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.flags.outputs.push == 'true' }}
          build-args: |
            SBOM_AIBOM=true
            BOMLENS_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=aibom
          cache-to: type=gha,mode=max,scope=aibom
      - name: Install cosign
        if: steps.flags.outputs.push == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v2.6.5
      - name: Sign AIBOM image
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${OWNER}/bomlens-aibom@${DIGEST}"
          cosign sign --yes "${REGISTRY}/${OWNER}/sbom-scanner-aibom@${DIGEST}"
      - name: Install syft (pinned release tarball)
        if: steps.flags.outputs.push == 'true'
        run: |
          SYFT_VERSION=$(grep -oP 'ARG SYFT_VERSION=\K\S+' docker/Dockerfile)
          ver="${SYFT_VERSION#v}"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${ver}_linux_amd64.tar.gz" -o /tmp/syft.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tgz syft
          syft version
      - name: Attest AIBOM image SBOM
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        run: |
          set -euo pipefail
          bl="${REGISTRY}/${OWNER}/bomlens-aibom@${DIGEST}"
          leg="${REGISTRY}/${OWNER}/sbom-scanner-aibom@${DIGEST}"
          syft "$bl" -o cyclonedx-json=sbom-aibom.cdx.json
          cosign attest --yes --predicate sbom-aibom.cdx.json --type cyclonedx "$bl"
          cosign attest --yes --predicate sbom-aibom.cdx.json --type cyclonedx "$leg"
      - name: Install Trivy (pinned release tarball)
        if: steps.flags.outputs.push == 'true'
        run: |
          TRIVY_VERSION=$(grep -oP 'ARG TRIVY_VERSION=\K\S+' docker/Dockerfile)
          ver="${TRIVY_VERSION#v}"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${ver}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/trivy.tgz trivy
          trivy --version
      # Report-only for now (exit-code 0), same reasoning as the firmware
      # image: the base publish gate already covers the shared layers, and
      # this image's own added surface (the OWASP AIBOM Generator + its
      # Python deps) has not been observed here yet.
      - name: Scan published AIBOM image with Trivy
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        # continue-on-error: report-only by design (see above); a transient
        # failure here must not fail this job over a re-pull of the biggest
        # of the four images (~3.8 GB), a ~2-hour rebuild if it has to redo.
        continue-on-error: true
        run: trivy image --quiet --scanners vuln --ignore-unfixed --format sarif --output trivy-image-aibom.sarif --exit-code 0 "${REGISTRY}/${OWNER}/bomlens-aibom@${DIGEST}"
      - name: Upload AIBOM image scan results
        if: steps.flags.outputs.push == 'true'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: 'trivy-image-aibom.sarif'
          category: trivy-image-aibom
        continue-on-error: true

  # (5) Deep-CVE image — base + grype and its bundled vulnerability DB for maven
  #     CPE matching against NVD (opt-in build). Separate image so the base stays
  #     lean; the DB is ~1.8 GB.
  build-deep-cve:
    name: Build deep-cve image
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    # `grype db update` downloads a ~1.8 GB DB at build time, once per
    # platform. Measured multi-arch build time: ~23 min. Plus ~2 min for the
    # arm64 tool/scan smoke test below and the re-pulls (syft attest, Trivy
    # scan) against a ~0.7 GB compressed image. 60 min is roughly double the
    # observed worst case.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
      security-events: write   # upload-sarif below needs this, or it fails
                                # silently under continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve publish flag
        id: flags
        run: echo "push=${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.push == true || github.ref == 'refs/heads/main') }}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/bomlens-deep-cve
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Resolve BOMLENS_VERSION
        id: version
        run: |
          v="${{ steps.meta.outputs.version }}"
          [ "$v" = "latest" ] && v="latest-$(git rev-parse --short HEAD)"
          echo "value=$v" >> "$GITHUB_OUTPUT"
      # grype ships an arm64 release tarball and the Dockerfile already
      # branches on `uname -m` for it, so this builds both platforms.
      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.flags.outputs.push == 'true' }}
          build-args: |
            SBOM_DEEP_CVE=true
            BOMLENS_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=deep-cve
          cache-to: type=gha,mode=max,scope=deep-cve
      # See the firmware job's own comment above: buildx's bundled QEMU built
      # the arm64 layers; running the loaded image afterward needs
      # binfmt_misc registered separately.
      - name: Set up QEMU (for running the built arm64 image, not for the build)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      # --load a single-arch arm64 image from the same cache and run grype
      # (this image's own postprocess swap-in) against a real Maven example,
      # so the check is grype actually matching under emulation, not just its
      # --version banner.
      - name: Smoke test arm64 image (emulated grype match)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 --load \
            --build-arg SBOM_DEEP_CVE=true \
            --build-arg BOMLENS_VERSION=${{ steps.version.outputs.value }} \
            --cache-from type=gha,scope=deep-cve \
            -t bomlens-deep-cve-arm64-smoke \
            ./docker

          echo "::group::grype version (arm64, emulated)"
          docker run --rm --entrypoint sh bomlens-deep-cve-arm64-smoke -c 'grype version'
          echo "::endgroup::"

          echo "::group::real deep-cve scan against examples/java-maven (arm64, emulated)"
          w="$(mktemp -d)"
          SBOM_DEEP_CVE_IMAGE=bomlens-deep-cve-arm64-smoke \
            bash scripts/scan-sbom.sh --project smoke --version 1.0 \
              --target examples/java-maven --deep-cve --generate-only \
              --output-dir "$w"
          sec="$w/smoke_1.0/smoke_1.0_security.json"
          jq -e '.' "$sec" >/dev/null
          echo "security report produced: $sec"
          echo "::endgroup::"
      - name: Install cosign
        if: steps.flags.outputs.push == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v2.6.5
      - name: Sign deep-cve image
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${OWNER}/bomlens-deep-cve@${DIGEST}"
      - name: Install syft (pinned release tarball)
        if: steps.flags.outputs.push == 'true'
        run: |
          SYFT_VERSION=$(grep -oP 'ARG SYFT_VERSION=\K\S+' docker/Dockerfile)
          ver="${SYFT_VERSION#v}"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${ver}_linux_amd64.tar.gz" -o /tmp/syft.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tgz syft
          syft version
      - name: Attest deep-cve image SBOM
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        run: |
          set -euo pipefail
          bl="${REGISTRY}/${OWNER}/bomlens-deep-cve@${DIGEST}"
          syft "$bl" -o cyclonedx-json=sbom-deep-cve.cdx.json
          cosign attest --yes --predicate sbom-deep-cve.cdx.json --type cyclonedx "$bl"
      - name: Install Trivy (pinned release tarball)
        if: steps.flags.outputs.push == 'true'
        run: |
          TRIVY_VERSION=$(grep -oP 'ARG TRIVY_VERSION=\K\S+' docker/Dockerfile)
          ver="${TRIVY_VERSION#v}"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${ver}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/trivy.tgz trivy
          trivy --version
      # Report-only for now (exit-code 0), same reasoning as the firmware
      # image: the base publish gate already covers the shared layers, and
      # this image's own added surface (grype + its ~1.8 GB vulnerability DB)
      # has not been observed here yet.
      - name: Scan published deep-cve image with Trivy
        if: steps.flags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ env.PUBLISH_OWNER }}
        # continue-on-error: report-only by design (see above); a transient
        # failure here must not fail this job over a re-pull.
        continue-on-error: true
        run: trivy image --quiet --scanners vuln --ignore-unfixed --format sarif --output trivy-image-deep-cve.sarif --exit-code 0 "${REGISTRY}/${OWNER}/bomlens-deep-cve@${DIGEST}"
      - name: Upload deep-cve image scan results
        if: steps.flags.outputs.push == 'true'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: 'trivy-image-deep-cve.sarif'
          category: trivy-image-deep-cve
        continue-on-error: true

  summary:
    name: Build summary
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    needs: [ build-postprocess, build-firmware, build-aibom, build-deep-cve ]
    # always(): the opt-in images are skipped on plain main pushes — still summarize.
    if: ${{ always() && github.event_name != 'pull_request' && needs.build-postprocess.result == 'success' }}
    timeout-minutes: 5
    steps:
      - run: |
          echo "## 🐳 Images built" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/bomlens\` (post-process, featured)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/sbom-generator\` (post-process, alias)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` (post-process, legacy alias)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/bomlens-firmware\` (firmware unpack/ID, GPL tools; legacy alias: sbom-scanner-firmware)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/bomlens-aibom\` (AI-model SBOM, OWASP AIBOM Generator; legacy alias: sbom-scanner-aibom)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.PUBLISH_OWNER }}/bomlens-deep-cve\` (maven CPE matching against NVD via grype; ~1.8 GB DB)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Language SBOM generation uses cdxgen official images (pulled on-demand by scan-sbom.sh)." >> $GITHUB_STEP_SUMMARY
