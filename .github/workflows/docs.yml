name: Docs site

# docs/ 정본 마크다운을 Astro Starlight(docs-site/)로 빌드해 GitHub Pages에 배포한다.
# 사이트 소스는 docs/이며, internal/ 등 공개하지 않는 파일은 docs-site/scripts/prepare-content.mjs가 제외한다.
# 저장소 Settings > Pages의 소스는 "브랜치"(gh-pages, 루트)로 지정돼 있어야 한다.
#
# 빌드 결과를 gh-pages 브랜치에 직접 push한다(고아 커밋으로 매번 히스토리를
# 새로 씀 — 브랜치는 빌드 산출물일 뿐이라 이력이 쌓일 이유가 없다). Actions
# 아티팩트는 거치지 않는다: upload-pages-artifact/deploy-pages 조합이 계속
# 실패해서, 그 저장소를 아예 안 쓰는 브랜치 push로 바꿨다. 나중에 그 조합이
# 다시 안정적으로 동작하면 Settings > Pages를 "GitHub Actions" 소스로 돌리고
# 이 워크플로도 아티팩트 방식으로 되돌리는 걸 고려할 것 — 지금 이 방식으로도
# 계속 문제없이 돌아간다면 굳이 되돌릴 필요는 없다.
#
# 사이트에는 읽기 전용 데모(/demo/)도 함께 실린다. 데이터(docs/demo/data/)는
# scripts/capture-demo-data.sh가 만들어 저장소에 커밋된 것이고, 화면을 그리는
# 번들만 여기서 빌드해 docs/demo/에 넣는다. 빌드 산출물을 저장소에 두지 않으려는
# 것이며, DOCS_INCLUDE_DEMO=1로 사이트를 빌드하면 docs/demo/가 그대로 복사된다.
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - docs-site/**
      - docker/shared/bomlens-tokens.css
      - .github/workflows/docs.yml
      - docker/web/frontend/**
  pull_request:
    branches:
      - main
    paths:
      - docs/**
      - docs-site/**
      - docker/shared/bomlens-tokens.css
      - .github/workflows/docs.yml
      - docker/web/frontend/**
  workflow_dispatch:
  # Callable from another repository so the site can be built on that
  # repository's runners and pushed to this one's gh-pages branch.
  workflow_call:
    inputs:
      target_repository:
        description: 'owner/name whose gh-pages branch receives the site (default: this repository)'
        required: false
        type: string
        default: ''
    secrets:
      PUBLISH_TOKEN:
        description: 'Token with contents:write on the target repository (default: the run GITHUB_TOKEN)'
        required: false

permissions:
  contents: read

concurrency:
  group: docs-site-deploy
  cancel-in-progress: false

env:
  # 사이트가 하위 경로(/bomlens/)에 서비스되므로 번들의 자산 경로와 데이터 경로
  # 모두 그 하위를 가리켜야 한다. docs-site/astro.config.mjs의 base와 함께 움직인다.
  DEMO_BASE_PATH: /bomlens/demo/
  DEMO_DATA_BASE: /bomlens/demo/data
  # gh-pages 브랜치를 받을 저장소. GITHUB_REPOSITORY는 예약 변수라 워크플로가
  # 덮어쓸 수 없고 언제나 잡이 도는 저장소를 가리키므로 그것을 쓰지 않는다.
  PUBLISH_REPO: ${{ inputs.target_repository || github.repository }}

jobs:
  # PR에서는 배포 없이 빌드와 링크 검사만 한다.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro 7이 Node 22 이상을 요구한다.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docker/web/frontend/package-lock.json
            docs-site/package-lock.json
      - name: Build the demo bundle
        run: bash scripts/build-demo-bundle.sh
      # docs/ 정본을 복사해 빌드하고, 내부 링크와 #앵커를 빌드된 사이트에서 검사한다.
      # 깨진 링크가 main 병합 전에 드러나게 하는 단계다.
      - name: Build the site
        working-directory: docs-site
        env:
          DOCS_INCLUDE_DEMO: '1'
        run: |
          npm ci
          npm run build
          npm run check-links
          mkdir -p ../site
          cp -R dist/. ../site/
      # 빌드된 사이트의 대표 페이지(홈, 시작, 레퍼런스; 영어와 한국어; 밝은 테마와
      # 어두운 테마)를 axe로 검사한다. 공용 토큰이나 문서 스타일을 바꿨을 때
      # 색 대비가 깨지면 여기서 드러난다.
      - name: Check the built site with axe
        working-directory: docker/web/frontend
        run: |
          npx playwright install --with-deps chromium
          npm run site:axe -- --dir ../../../site --prefix /bomlens

  # main에서는 빌드 결과를 gh-pages 브랜치에 직접 push해 배포한다. 브랜치 쓰기가
  # 필요하므로 이 잡만 contents: write로 권한을 올린다.
  build-site:
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro 7이 Node 22 이상을 요구한다.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docker/web/frontend/package-lock.json
            docs-site/package-lock.json
      - name: Build the demo bundle
        run: bash scripts/build-demo-bundle.sh
      # docs/ 정본을 복사해 빌드하고, 내부 링크와 #앵커를 빌드된 사이트에서 검사한다.
      # 깨진 링크가 main 병합 전에 드러나게 하는 단계다.
      - name: Build the site
        working-directory: docs-site
        env:
          DOCS_INCLUDE_DEMO: '1'
        run: |
          npm ci
          npm run build
          npm run check-links
          mkdir -p ../site
          cp -R dist/. ../site/

      # site/를 고아 커밋 하나로 gh-pages에 강제 push한다. 이 브랜치는 빌드
      # 산출물일 뿐이라 이력을 쌓을 이유가 없고, 매번 새로 써서 브랜치가
      # 무한정 커지는 것도 막는다.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A -f
          git commit -q -m "docs: publish ${GITHUB_SHA}"
          # The demo bundle must be in the commit; a missing one would only show as a 404.
          git ls-files --error-unmatch demo/index.html > /dev/null
          git push --force "https://x-access-token:${PUSH_TOKEN}@github.com/${PUBLISH_REPO}.git" HEAD:gh-pages
        env:
          PUSH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          # Not GITHUB_REPOSITORY: that is reserved and a workflow cannot
          # override it, so it always names the repository running the job.
          PUBLISH_REPO: ${{ env.PUBLISH_REPO }}
