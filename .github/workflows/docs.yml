name: Docs site

# docs/ 정본 마크다운을 MkDocs Material로 빌드해 GitHub Pages에 배포한다.
# 사이트 소스는 docs/이며, internal/과 contributing/는 mkdocs.yml의 exclude_docs로 제외된다.
# 저장소 Settings > Pages의 소스는 "브랜치"(gh-pages, 루트)로 지정돼 있어야 한다.
#
# 빌드 결과를 gh-pages 브랜치에 직접 push한다(고아 커밋으로 매번 히스토리를
# 새로 씀 — 브랜치는 빌드 산출물일 뿐이라 이력이 쌓일 이유가 없다). Actions
# 아티팩트는 거치지 않는다: upload-pages-artifact/deploy-pages 조합이 계속
# 실패해서, 그 저장소를 아예 안 쓰는 브랜치 push로 바꿨다. 나중에 그 조합이
# 다시 안정적으로 동작하면 Settings > Pages를 "GitHub Actions" 소스로 돌리고
# 이 워크플로도 아티팩트 방식으로 되돌리는 걸 고려할 것 — 지금 이 방식으로도
# 계속 문제없이 돌아간다면 굳이 되돌릴 필요는 없다.
#
# 사이트에는 읽기 전용 데모(/demo/)도 함께 실린다. 데이터(docs/demo/data/)는
# scripts/capture-demo-data.sh가 만들어 저장소에 커밋된 것이고, 화면을 그리는
# 번들만 여기서 빌드해 docs/demo/에 넣는다. 빌드 산출물을 저장소에 두지 않으려는
# 것이며, mkdocs가 docs/ 하위의 비마크다운 파일을 그대로 복사하므로 별도 배포
# 단계는 필요하지 않다.
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - .github/workflows/docs.yml
      - docker/web/frontend/**
  pull_request:
    branches:
      - main
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - .github/workflows/docs.yml
      - docker/web/frontend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-deploy
  cancel-in-progress: false

env:
  # 사이트가 하위 경로(/bomlens/)에 서비스되므로 번들의 자산 경로와 데이터 경로
  # 모두 그 하위를 가리켜야 한다. mkdocs.yml의 site_url과 함께 움직인다.
  DEMO_BASE_PATH: /bomlens/demo/
  DEMO_DATA_BASE: /bomlens/demo/data

jobs:
  # PR에서는 배포 없이 빌드만 검증한다. --strict라 깨진 링크·설정 오류가
  # main 병합 전에 드러난다.
  build:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, bomlens-wsl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docker/web/frontend/package-lock.json
      - name: Build the demo bundle
        run: bash scripts/build-demo-bundle.sh
      # 시스템 파이썬은 externally-managed라 venv로 격리해 의존성을 설치한다.
      - name: Build (no deploy)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict

  # main에서는 빌드 결과를 gh-pages 브랜치에 직접 push해 배포한다. 브랜치 쓰기가
  # 필요하므로 이 잡만 contents: write로 권한을 올린다.
  build-site:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, bomlens-wsl]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docker/web/frontend/package-lock.json
      - name: Build the demo bundle
        run: bash scripts/build-demo-bundle.sh
      # 시스템 파이썬은 externally-managed라 venv로 격리해 의존성을 설치한다.
      - name: Build
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict

      # site/를 고아 커밋 하나로 gh-pages에 강제 push한다. 이 브랜치는 빌드
      # 산출물일 뿐이라 이력을 쌓을 이유가 없고, 매번 새로 써서 브랜치가
      # 무한정 커지는 것도 막는다.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -q -m "docs: publish ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
