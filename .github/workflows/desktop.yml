name: Desktop App

# Electron 데스크톱 앱(인스톨러) 빌드. 스캐너는 여전히 Docker로 실행되며, 이 앱은
# 더블클릭 진입점을 제공한다. electron/ 변경 PR, 수동 실행, 태그 푸시에서 빌드한다.
on:
  workflow_dispatch:
    inputs:
      reseed_lock:
        description: "Regenerate electron/package-lock.json (npm install --package-lock-only, dev included) and commit it to this branch"
        type: boolean
        default: false
  # Callable from other workflows (nightly runs it daily so Electron/runner/OS
  # drift surfaces within 24h even when electron/ itself has not changed), and
  # from another repository, which is why the attach step below can be pointed
  # at a release that lives elsewhere.
  workflow_call:
    inputs:
      target_repository:
        description: 'owner/name whose release the installers attach to (default: this repository)'
        required: false
        type: string
        default: ''
      tag:
        description: 'Release tag to attach to. Needed when the caller is not itself on a tag.'
        required: false
        type: string
        default: ''
    secrets:
      PUBLISH_TOKEN:
        description: 'Token with contents:write on the target repository (default: the run GITHUB_TOKEN)'
        required: false
  pull_request:
    paths:
      - electron/**
      - .github/workflows/desktop.yml
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  test:
    # container.mjs 순수 로직 단위 테스트(electron 불필요, 빠름).
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node --test test/*.test.mjs

  # Regenerates electron/package-lock.json and commits it to the dispatching
  # branch, the same on-demand pattern ci.yml uses for visual baselines: run
  # this whenever electron/package.json's dependencies change, then main takes
  # the committed lock through the PR. Not installing electron itself here
  # (--package-lock-only skips downloading the binary), but the resolved
  # versions and an audit against them still land in this job's log so a
  # reviewer can read them without installing anything locally.
  reseed-lock:
    name: Regenerate electron lock file
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.reseed_lock == 'true'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: electron
    steps:
      # No persist-credentials: false here (unlike the other jobs in this
      # file): the commit step below needs the injected GITHUB_TOKEN to push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Generate lock file
        run: npm install --package-lock-only
      # --package-lock-only writes the lock without touching node_modules, so
      # `npm list` (which reads node_modules) sees nothing installed and exits
      # non-zero. Read the versions the lock actually resolved to instead.
      - name: Resolved versions
        run: |
          node -e '
            const lock = require("./package-lock.json");
            for (const name of ["electron", "electron-builder"]) {
              console.log(name, lock.packages["node_modules/" + name].version);
            }
          '
      # Informational: audits the lock just generated, dev dependencies
      # included (npm audit's default scope). Not a gate, since this job only
      # runs on demand, but its output is what a reviewer checks instead of
      # running npm audit locally.
      - name: npm audit (informational)
        run: npm audit || true
      - name: Commit lock file
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Dispatch a reseed from a feature branch. The lock file is committed to the branch it was dispatched from, and main takes changes through a PR."
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/package-lock.json
          if git diff --cached --quiet; then
            echo "::notice::Lock file regenerated with no change, nothing to commit."
            exit 0
          fi
          git commit -m "chore(desktop): regenerate package-lock.json" \
                     -m "Regenerated by the reseed_lock dispatch of run ${{ github.run_id }}."
          git push origin "HEAD:${{ github.ref_name }}"
          echo "::notice::Lock file committed to ${{ github.ref_name }}. Pull before you continue on that branch."

  build-desktop:
    needs: test
    # 태그 푸시일 때 인스톨러를 해당 릴리스에 첨부하므로 쓰기 권한이 필요하다.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
            artifact: desktop-windows
          # --universal 필수: CLI 타깃 명시가 yml의 arch 설정을 덮어쓰므로,
          # 이 플래그가 없으면 러너 아키텍처(arm64) 단일 빌드가 된다.
          - os: macos-latest
            args: --mac dmg --universal
            artifact: desktop-macos
    runs-on: ${{ matrix.os == 'windows-latest'
      && fromJSON(vars.CI_WINDOWS_RUNNER || '["self-hosted","windows","bomlens-win"]')
      || fromJSON(vars.CI_MACOS_RUNNER || '["self-hosted","macos","bomlens-macos-desktop"]') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      # 부팅 스모크: 인스톨러 빌드 전에 앱이 이 OS에서 실제로 켜지고 첫 화면(en/ko)을
      # 렌더하는지 확인한다. SBOM_SMOKE로 Docker/컨테이너 기동은 건너뛰어 결정론적이다.
      - name: Boot smoke (app launches and renders)
        run: npm run test:smoke
      # 서명은 시크릿이 있을 때만 켜진다(없으면 미서명). 어떤 레지스트리에도 publish 하지 않는다.
      # 태그 빌드는 버전을 태그에서 주입해 인스톨러 파일명이 릴리스와 항상 일치하게 한다.
      - name: Build installer
        shell: bash
        run: |
          # Unconfigured secrets arrive as EMPTY env vars, and electron-builder
          # treats an empty CSC_LINK as "certificate provided", then fails trying
          # to import it ("not a file"). PR builds never hit this because signing
          # is skipped on pull requests entirely — only push/dispatch builds do.
          # Unset the empty ones so unsigned builds stay unsigned.
          [ -n "${CSC_LINK:-}" ] || unset CSC_LINK CSC_KEY_PASSWORD
          [ -n "${WIN_CSC_LINK:-}" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          [ -n "${APPLE_ID:-}" ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          args=(${{ matrix.args }} --publish never)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=("-c.extraMetadata.version=${GITHUB_REF#refs/tags/v}")
          fi
          npx --no-install electron-builder "${args[@]}"
        env:
          # Code signing is inert until these repo secrets are configured; without
          # them the build stays unsigned (current behavior). Keep the Windows and
          # macOS certificates in SEPARATE secrets: the generic CSC_LINK is also read
          # by the macOS build, so a Windows .pfx placed there would be imported as
          # an Apple certificate on the macos runner. See electron/README.md.
          # Windows Authenticode certificate (.pfx) — signs the NSIS installer.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS Developer ID Application certificate (.p12).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization — all-or-none: setting only part of the APPLE_*
          # trio makes electron-builder fail the build with a configuration error.
          # When absent, notarization is skipped with a warning (signing itself is
          # only attempted when a certificate is present, so unsigned builds never
          # reach the notarization step).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Stay unsigned on macOS unless a Developer ID cert is provided.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      # Installer smoke: the artifact users actually download was never
      # installed or launched anywhere — release verification checked size and
      # checksum only, so a packaging regression (missing asar entry, broken
      # relative path, bad executable bits) could ship. Mount/install the just-
      # built installer, launch the INSTALLED binary with SBOM_SMOKE=1 (no
      # Docker, no image pull), and require the startup log's ready line. Runs
      # before upload/attach, so a broken installer never reaches a release.
      - name: Installer smoke (mount dmg, launch installed app)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          dmg="$(ls dist-electron/BomLens-Setup*.dmg | head -1)"
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          cp -R "$mnt/BomLens.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          # userData keeps the technical id (package.json name), not the display
          # name — the same path the app uses in every install.
          log="$HOME/Library/Application Support/sbom-generator-desktop/startup.log"
          rm -f "$log"
          SBOM_SMOKE=1 SBOM_LANG=en "$RUNNER_TEMP/BomLens.app/Contents/MacOS/BomLens" &
          pid=$!
          ok=0
          for _ in $(seq 1 60); do
            grep -q "Ready. Opening the UI." "$log" 2>/dev/null && { ok=1; break; }
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" != 1 ]; then
            echo "::error::installed app never reached the ready line"
            cat "$log" 2>/dev/null || true
            exit 1
          fi
          echo "installed .app booted to the ready line"

      - name: Installer smoke (silent NSIS install, launch installed app)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-electron -Filter 'BomLens-Setup*.exe' | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\Programs\BomLens\BomLens.exe"
          if (!(Test-Path $app)) { throw "installed app not found: $app" }
          # userData keeps the technical id (package.json name), not the display name.
          $log = "$env:APPDATA\sbom-generator-desktop\startup.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:SBOM_SMOKE = "1"; $env:SBOM_LANG = "en"
          $p = Start-Process -FilePath $app -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Ready. Opening the UI." -Quiet)) { $ok = $true; break }
            if ($p.HasExited) { break }
            Start-Sleep 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            if (Test-Path $log) { Get-Content $log }
            throw "installed app never reached the ready line"
          }
          Write-Host "installed .exe booted to the ready line"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # This is boot-smoke-test evidence for the daily nightly run, not the
        # user-facing installer (that's attached to the release separately,
        # below), so a failure here must never take the release-attach step
        # below down with it (Actions artifact storage is a separate quota
        # from everything else this workflow does, and can be unavailable
        # for reasons that have nothing to do with the actual build).
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.dmg
          if-no-files-found: warn
          # The 90-day default retention let a year of daily macOS+Windows
          # builds pile up into real Actions storage billing.
          retention-days: 7
      # 태그 릴리스에는 같은 릴리스에 인스톨러를 덧붙여 일반 사용자가 바로 받게 한다.
      # PR과 수동 실행에서는 이 단계를 건너뛰고 위 아티팩트만 남긴다.
      - name: Attach installer to the release
        # A tag push names the release through the ref. A caller that is not
        # itself on a tag names it with the `tag` input instead, which is how a
        # release assembled from another repository reaches the right one.
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: ${{ inputs.target_repository || github.repository }}
          token: ${{ secrets.PUBLISH_TOKEN || github.token }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Preserve the draft state set by release.yml's create-release: without
          # this, action-gh-release's default (draft: false) would publish the
          # release as soon as the installers attach, bypassing the release-gate.
          draft: true
          files: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.dmg
          fail_on_unmatched_files: false
