name: Heavy E2E (reusable)

# The heavy end-to-end suites (web UI E2E, comprehensive CLI E2E, docs
# walkthrough) in one reusable workflow. Both ci.yml (dispatch and
# path-filtered PRs) and nightly.yml (daily full run) call this, so the step
# definitions exist exactly once and the two schedules can never drift apart.
#
# `suites` selects which of the three jobs run; the other inputs mirror ci.yml's
# workflow_dispatch knobs (opt-in firmware/deep-license image builds, example
# subset for the real-example scan suite).
on:
  workflow_call:
    inputs:
      suites:
        description: "Space-separated subset of: web-e2e full-e2e docs-walkthrough"
        type: string
        default: "web-e2e full-e2e docs-walkthrough"
      firmware:
        description: "Also build the firmware image so full-e2e's firmware group runs"
        type: boolean
        default: false
      deep_license:
        description: "Also build the deep-license (scancode) image; its build gate runs a real license scan"
        type: boolean
        default: false
      firmware_pull:
        description: "PULL the published firmware image (fast) instead of building, so full-e2e's firmware group runs"
        type: boolean
        default: false
      examples_only:
        description: "ONLY= subset for test-examples-e2e.sh (empty = all bundled examples)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  web-e2e:
    name: Web UI E2E (container scan -> done)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    if: contains(inputs.suites, 'web-e2e')
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The NVD CPE index stage is most of this image's build (about 3.5 of
      # 4.5 minutes). Pinning the feed to its current HEAD commit builds the
      # same data an unpinned clone would, and gives the stage a cache key:
      # the feed moves every two hours, and runs in between reuse the stage
      # from the Actions cache instead of cloning and distilling it again.
      - name: Resolve the NVD feed commit
        id: feed
        run: |
          set -euo pipefail
          repo=$(grep -oP 'ARG NVD_FEED_REPO="\K[^"]+' docker/Dockerfile)
          ref=$(git ls-remote "$repo" HEAD | cut -f1)
          [ -n "$ref" ] || { echo "::error::could not resolve HEAD of $repo"; exit 1; }
          echo "NVD feed $repo at $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Base image + SCANOSS only: gives us server.py, run-scan, syft and
      # scanoss-py — enough for the sbom-upload (ANALYZE), docker-image (IMAGE),
      # current-dir (SOURCE/syft) cases and the dot-path SCANOSS regression. The
      # 15GB cdxgen language image and firmware/aibom flavors are deliberately
      # excluded to keep the build light; those scan paths fall back to syft.
      # The CPE index stage is read from the cache when a run at the same feed
      # commit saved it (the step below); docker-publish.yml's cpe-index scope
      # is read too, since a publish at that commit already holds it.
      - name: Build scanner image (base + scanoss)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          load: true
          push: false
          build-args: |
            SBOM_SCANOSS=true
            NVD_FEED_REF=${{ steps.feed.outputs.ref }}
          tags: bomlens-e2e:ci
          cache-from: |
            type=gha,scope=web-e2e-cpe-index
            type=gha,scope=cpe-index

      # Only the CPE index stage is written to the cache (its own scope, about
      # 180 MB), so the much larger image layers do not fill the repository's
      # cache quota. The stage is already in this builder from the step above,
      # so this only exports it.
      - name: Save the CPE index stage to the cache
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          target: cpe-index
          outputs: type=cacheonly
          build-args: |
            NVD_FEED_REF=${{ steps.feed.outputs.ref }}
          cache-to: type=gha,mode=max,scope=web-e2e-cpe-index

      - name: Run web UI e2e (SSE scan-stream -> done)
        env:
          SBOM_E2E_IMAGE: bomlens-e2e:ci
        run: bash tests/test-web-e2e.sh

  full-e2e:
    name: Full CLI E2E (comprehensive + examples)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    if: contains(inputs.suites, 'full-e2e')
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Grant script permissions
        run: chmod +x scripts/scan-sbom.sh tests/test-e2e.sh tests/test-examples-e2e.sh

      # Tag as sbom-scanner:test — the default image name both scripts expect, so
      # they run with no extra env. base + scanoss covers analyze/source/image/
      # cosign; cdxgen per-language images are pulled on demand for source scans.
      - name: Build scanner image (base + scanoss)
        run: docker build --build-arg SBOM_SCANOSS=true -t sbom-scanner:test ./docker

      # Opt-in: building the GPL firmware image (unblob/cve-bin-tool) is slow, so
      # it is only built when the caller asks for it. test-e2e.sh skips its
      # firmware group when this image is absent.
      - name: Build firmware image (opt-in)
        if: inputs.firmware
        run: docker build --build-arg SBOM_FIRMWARE=true -t sbom-scanner-firmware:test ./docker

      # Nightly firmware coverage without the 20-30 min GPL-image build: pull
      # the PUBLISHED firmware image and tag it as the name test-e2e.sh's
      # firmware group auto-enables on. This validates the published image plus
      # HEAD's harness within 24h; HEAD's firmware Dockerfile itself is still
      # validated by docker-publish.yml when it runs and by dispatching with
      # firmware=true.
      - name: Pull published firmware image (opt-in, fast)
        if: inputs.firmware_pull && !inputs.firmware
        run: |
          docker pull ghcr.io/sktelecom/bomlens-firmware:latest
          docker tag ghcr.io/sktelecom/bomlens-firmware:latest sbom-scanner-firmware:test

      # Opt-in: the deep-license (scancode) image compiles PyICU and pulls native
      # libarchive/libmagic, so it is slow and only built when the caller asks.
      # Its Dockerfile build gate runs a real license scan, so a regression in
      # those native deps fails the build here rather than at runtime.
      - name: Build deep-license image (opt-in)
        if: inputs.deep_license
        run: docker build --build-arg SBOM_DEEP_LICENSE=true -t sbom-scanner-deep-license:test ./docker

      # The deep-license image as a scan engine: deep-license ok with the
      # scancode output in bomlens-result.json, and on the base image
      # skipped/not_installed with the flag, disabled without it.
      - name: Deep-license image result manifest
        if: inputs.deep_license
        run: bash tests/test-deep-license-image.sh sbom-scanner-deep-license:test sbom-scanner:test

      - name: Run comprehensive CLI e2e (test-e2e.sh)
        run: bash tests/test-e2e.sh

      # examples_only bounds runtime for callers on a budget (pull requests scan a
      # representative npm/pip/gomod subset); empty scans every bundled example.
      - name: Run real-example scan e2e (test-examples-e2e.sh)
        env:
          ONLY: ${{ inputs.examples_only }}
        run: bash tests/test-examples-e2e.sh

      # The init script behind the java-gradle runtime classpath filter, run by
      # the real Gradle versions (6.9.4 to 9.8.2) of the official gradle images,
      # with the configuration cache on and off. It needs Docker and Maven
      # Central, and takes about ten minutes, so it lives here and not in ci.yml.
      - name: Run Gradle runtime classpath e2e (test-gradle-runtime.sh)
        run: bash tests/test-gradle-runtime.sh

  docs-walkthrough:
    name: Docs Walkthrough (getting-started commands)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    if: contains(inputs.suites, 'docs-walkthrough')
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Base image (syft) is enough: the first-scan walkthrough scans the bundled
      # example as a directory (ROOTFS/syft). Tag it sbom-scanner:test, the
      # default the harness expects.
      - name: Build scanner image (base)
        run: docker build -t sbom-scanner:test ./docker

      # docs/reference/docker-image.md's runnable blocks name the PUBLISHED
      # image verbatim (that is what a reader pastes). Point that tag at the
      # image built from THIS commit so the blocks run against repo HEAD; the
      # nightly user journey covers the genuinely published image instead.
      - name: Tag built image with the published name (docs run verbatim)
        run: docker tag sbom-scanner:test ghcr.io/sktelecom/bomlens:latest

      - name: Run docs walkthrough
        run: bash tests/test-docs-walkthrough.sh
