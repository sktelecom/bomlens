name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
  # Callable from another repository so the release can be assembled on that
  # repository's runners while the artefacts land here and keep this
  # repository's signing identity: Sigstore builds the certificate subject from
  # the called workflow's ref, not the caller's. Leaving the inputs empty keeps
  # the current behaviour, so a fork that calls this without them releases to
  # itself.
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      target_repository:
        description: 'owner/name to publish the release to (default: this repository)'
        required: false
        type: string
        default: ''
      owner:
        description: 'Registry namespace the images were published under (default: this repository owner)'
        required: false
        type: string
        default: ''
    secrets:
      PUBLISH_TOKEN:
        description: 'Token with contents:write on the target repository (default: the run GITHUB_TOKEN)'
        required: false

# Default to read-only; jobs that create or edit the release elevate to
# contents: write themselves. Nothing in this workflow pushes packages.
permissions:
  contents: read

env:
  PUBLISH_REPO: ${{ inputs.target_repository || github.repository }}
  PUBLISH_OWNER: ${{ inputs.owner || github.repository_owner }}

# Keyed by PUBLISH_REPO (the actual release target), not by which repository
# is running the job -- those differ for exactly the case this needs to
# handle. A rehearsal tag push on the fork and a release-upstream.yml dispatch
# for the same version are BOTH runs of this workflow on the fork's runners,
# but they target different releases: the tag push's PUBLISH_REPO defaults to
# github.repository (the fork itself), while the dispatch explicitly sets
# target_repository to sktelecom/bomlens. Keying on ref/version alone would
# put them in the same group and make the real release's release-gate queue
# behind a rehearsal that publishes nowhere near it -- and that exact
# sequence (rehearsal tag push, then release-upstream dispatch) is this
# project's own documented release procedure. No cancel-in-progress: the rare
# case that DOES collide (two dispatches for the same target and version)
# queues rather than cancelling release-gate partway through signing the
# checksum file.
concurrency:
  # Same expression PUBLISH_REPO uses below -- the `env` context is not
  # available in a top-level `concurrency:` block, so it is repeated here
  # rather than referenced.
  group: release-${{ inputs.target_repository || github.repository }}-${{ inputs.version || github.ref_name }}

jobs:
  create-release:
    name: Create Release
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    timeout-minutes: 15
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Extract version
        id: version
        run: |
          # Both the manual dispatch and a cross-repository call name the
          # version outright; a tag push does not, so it falls back to the ref.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Image tags follow SemVer without the leading "v" (metadata-action {{version}}).
          echo "image_version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Generate changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(sed -n "/## \[${{ steps.version.outputs.version }}\]/,/## \[/p" CHANGELOG.md | sed '$d' | sed '1{/^## \[/d}')
          else
            CHANGELOG=$(git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD --pretty=format:"- %s" 2>/dev/null || echo "Initial release")
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: ${{ env.PUBLISH_REPO }}
          token: ${{ secrets.PUBLISH_TOKEN || github.token }}
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## BomLens ${{ steps.version.outputs.version }}

            Generate a CycloneDX SBOM, an open-source notice (고지문), and a security report from your source code — or assess the open-source risk of an SBOM or firmware you receive.

            ### Changes

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            #### Desktop app (double-click, no CLI)
            Download `BomLens-Setup.exe` (Windows) or `BomLens-Setup.dmg` (macOS) from the assets below. Unsigned for now; if Windows SmartScreen warns, choose "More info", then "Run anyway".

            #### Scripts (CLI)
            Download `bomlens-cli-linux.tar.gz` (Linux/macOS) or `bomlens-cli-windows.zip` (Windows) from the assets below and extract it — the archive carries `scan-sbom.sh` together with the host-side files it needs (a single raw download of `scan-sbom.sh` will not run on its own).
            ```bash
            tar -xzf bomlens-cli-linux.tar.gz
            ./scripts/scan-sbom.sh --help
            ```
            
            #### Docker Image
            ```bash
            docker pull ghcr.io/${{ env.PUBLISH_OWNER }}/sbom-generator:${{ steps.version.outputs.image_version }}   # legacy alias: sbom-scanner
            ```
            
            ### Documentation
            
            - [Getting Started](https://sktelecom.github.io/bomlens/start/first-scan/)
            - [Notice, security & risk reports](https://sktelecom.github.io/bomlens/guides/reports/)
            - [Usage Guide](https://sktelecom.github.io/bomlens/reference/cli/)
            - [Examples](https://sktelecom.github.io/bomlens/reference/ecosystems/)
          # Created as a draft so it is not shown as the latest release until the
          # release-gate job confirms a first-time user's entry points actually
          # work (installers attached, published image runs the documented
          # command). The gate flips this to published on success.
          draft: true
          prerelease: false
  
  upload-assets:
    name: Upload Release Assets
    needs: create-release
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Scripts. The CLI bundles must carry the host-side lib files
          # scan-sbom.sh needs: source-detect.sh and cdx-version.sh are both
          # sourced unconditionally on the host (both under set -e), and
          # build-prep.sh is mounted into the container for source scans. Paths
          # are preserved so the scan-sbom(.bat) -> scan-sbom.sh ->
          # REPO_DIR/docker/lib resolution works after extraction. Omitting
          # either sourced file makes even `scan-sbom.sh --help` exit 1 before
          # any scan.
          # Every bundle carries the same three license documents. Apache-2.0
          # section 4 asks a redistributor for a copy of the License and the
          # NOTICE contents, and whoever downloads a bundle becomes one;
          # THIRD_PARTY_LICENSES.md travels with them because it is where the
          # NOTICE points for the bundled tools and the GPL source offer.
          LICENSE_FILES="LICENSE NOTICE THIRD_PARTY_LICENSES.md"

          cp scripts/scan-sbom.sh release-assets/
          chmod +x release-assets/scan-sbom.sh
          # shellcheck disable=SC2086  # word splitting is how the file list expands
          tar -czf release-assets/bomlens-cli-linux.tar.gz \
            scripts/scan-sbom.sh docker/lib/source-detect.sh docker/lib/build-prep.sh \
            docker/lib/cdx-version.sh $LICENSE_FILES

          # Windows runtime bundle: both launchers, the orchestration script,
          # and the host-side lib files above. sbom-ui.bat is self-contained
          # (double-click web UI). check-setup.bat must ship too: the launchers'
          # own error messages tell users to double-click it, and the settings
          # example is how a non-CLI user reaches UI_PORT / SBOM_IMAGE_TAR (env
          # vars die on a double-click).
          # shellcheck disable=SC2086
          zip -r release-assets/bomlens-cli-windows.zip \
            scripts/scan-sbom.sh scripts/scan-sbom.bat scripts/sbom-ui.bat \
            scripts/check-setup.bat scripts/bomlens.settings.example.txt \
            docker/lib/source-detect.sh docker/lib/build-prep.sh \
            docker/lib/cdx-version.sh $LICENSE_FILES

          # Examples
          # shellcheck disable=SC2086
          tar -czf release-assets/bomlens-examples-${{ needs.create-release.outputs.version }}.tar.gz \
            examples/ $LICENSE_FILES

          # Complete package (includes docker/ so the host has build-prep.sh for CLI source scans).
          # shellcheck disable=SC2086
          tar -czf release-assets/bomlens-${{ needs.create-release.outputs.version }}.tar.gz \
            scripts/ docker/ examples/ docs/ README.md $LICENSE_FILES

      # A tool that generates SBOMs ships one for itself. This one covers the
      # source bundles: every manifest this repository ships, which is where the
      # desktop app's and the web UI's dependencies are declared. The scanner
      # image has its own SBOM, signed as an attestation in docker-publish.yml
      # and attached to the release there.
      - name: Install syft (pinned release tarball)
        run: |
          # Single source of truth: the version pinned in docker/Dockerfile.
          SYFT_VERSION=$(grep -oP 'ARG SYFT_VERSION=\K\S+' docker/Dockerfile)
          ver="${SYFT_VERSION#v}"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${ver}_linux_amd64.tar.gz" -o /tmp/syft.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tgz syft
          syft version

      - name: Generate the release SBOM
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          # examples/ is left out on purpose: those fixtures pin old versions so
          # the scanner has something to find, and listing them here would read
          # as this project's own dependencies.
          syft scan dir:. \
            --exclude './examples/**' --exclude './electron/node_modules/**' \
            --exclude './release-assets/**' --exclude './tests/**' \
            --source-name bomlens --source-version "$VERSION" \
            -o "cyclonedx-json=release-assets/bomlens-source-${VERSION}.cdx.json"

          # An SBOM with nothing in it is indistinguishable from a clean result,
          # which is the one failure this asset must not ship with.
          n=$(jq '.components | length' "release-assets/bomlens-source-${VERSION}.cdx.json")
          echo "release SBOM: $n components"
          [ "$n" -gt 0 ] || { echo "::error::the release SBOM has no components"; exit 1; }

      - name: Write the checksum file
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          # Checksums so downloaders can verify integrity of these assets. The
          # release gate appends the installer lines later and signs the result.
          ( cd release-assets && sha256sum \
            bomlens-cli-linux.tar.gz \
            bomlens-cli-windows.zip \
            "bomlens-examples-${VERSION}.tar.gz" \
            "bomlens-${VERSION}.tar.gz" \
            "bomlens-source-${VERSION}.cdx.json" \
            > SHA256SUMS.txt )

      - name: Verify the CLI bundles are self-sufficient
        # The CLI zip/tar must carry every host-side file scan-sbom.sh sources
        # or the extracted bundle dies before any scan (source-detect.sh was
        # missing once and no test caught it — it is not in the container).
        # Extract each into a clean dir and prove `scan-sbom.sh --help` runs.
        run: |
          set -e
          for pkg in \
            "tar:release-assets/bomlens-cli-linux.tar.gz" \
            "zip:release-assets/bomlens-cli-windows.zip"; do
            kind="${pkg%%:*}"; file="${pkg#*:}"
            dir="$(mktemp -d)"
            case "$kind" in
              tar) tar -xzf "$file" -C "$dir" ;;
              zip) unzip -q "$file" -d "$dir" ;;
            esac
            if ! bash "$dir/scripts/scan-sbom.sh" --help >/dev/null 2>"$dir/err"; then
              echo "FAIL: $file — extracted scan-sbom.sh --help exited non-zero:"; cat "$dir/err"; exit 1
            fi
            # The extracted bundle must also state its own terms. Checking the
            # unpacked tree (not the tar/zip argument list) is what catches a
            # file that was named but never actually packed.
            for name in LICENSE NOTICE THIRD_PARTY_LICENSES.md; do
              if [ ! -s "$dir/$name" ]; then
                echo "FAIL: $file — extracted bundle has no $name"; exit 1
              fi
            done
            echo "OK: $file is self-sufficient and carries its license files"
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: ${{ env.PUBLISH_REPO }}
          token: ${{ secrets.PUBLISH_TOKEN || github.token }}
          tag_name: ${{ needs.create-release.outputs.version }}
          # Keep the release a draft — action-gh-release defaults draft to false,
          # which would otherwise publish it here, before the release-gate has
          # verified it. Only the gate's `gh release edit --draft=false` publishes.
          draft: true
          files: |
            release-assets/bomlens-cli-linux.tar.gz
            release-assets/bomlens-cli-windows.zip
            release-assets/bomlens-examples-${{ needs.create-release.outputs.version }}.tar.gz
            release-assets/bomlens-${{ needs.create-release.outputs.version }}.tar.gz
            release-assets/bomlens-source-${{ needs.create-release.outputs.version }}.cdx.json
            release-assets/SHA256SUMS.txt
  
  # Run the docs walkthrough on the TAGGED COMMIT before the gate publishes
  # anything. verify-release.sh re-runs it later on the published image, but
  # only after polling for async assets; a broken runnable block in the docs
  # should stop the release as early and cheaply as possible. Runs in parallel
  # with upload-assets, so it adds little wall-clock time.
  docs-walkthrough:
    name: Docs Walkthrough (release gate)
    uses: ./.github/workflows/heavy-e2e.yml
    with:
      suites: docs-walkthrough

  release-gate:
    name: Release Gate (verify entry points, then publish)
    needs: [create-release, upload-assets, docs-walkthrough]
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    # verify-release.sh runs five separate polling/verification steps, each
    # with its own worst-case ceiling: installers (VERIFY_TIMEOUT, 35 min
    # default), the main image (another 35 min, plus however long its one
    # final pull attempt past the deadline takes -- the deadline check only
    # runs BETWEEN attempts, not during one), the docs walkthrough against
    # the published image (~40-45 min observed, in between the two so the
    # opt-in images below get more time to build first -- see its own
    # comment), the three opt-in images checked against ONE shared deadline
    # (VERIFY_SECONDARY_TIMEOUT, 90 min default -- sized for aibom's own
    # ~86-minute build, the slowest of the three -- plus one final pull past
    # that deadline too, aibom's own ~3.8 GB), and the checksum/cosign/
    # publish steps after it (a few min, with their own small retries).
    # Summed worst case is around 210-220 min for the script alone, plus
    # this job's own non-script steps around it (checkout, buildx setup,
    # installer checksums, cosign install, gh release download/sign-blob/
    # upload/edit -- another ~5-10 min): call it 230 min. This bounds a
    # genuine hang, not the normal slow-but-succeeding poll, so it needs
    # real margin above that sum, not a number equal to it or below --
    # hence 260, not 230.
    timeout-minutes: 260
    permissions:
      contents: write
      packages: read
      id-token: write   # keyless cosign signing of the checksum file
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Confirm the recommended entry points work for THIS release before it is
      # shown to users: the desktop installers are attached (built async by
      # desktop.yml), and the documented first-scan command produces a valid SBOM
      # on the actual published image (pushed async by docker-publish.yml). Both
      # are polled until ready, then exercised; failure leaves the release a draft.
      - name: Verify the release is ready for users
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          # Not GITHUB_REPOSITORY: that is reserved and a workflow cannot
          # override it, so it always names the repository running the job.
          PUBLISH_REPO: ${{ env.PUBLISH_REPO }}
        run: bash scripts/verify-release.sh "${{ needs.create-release.outputs.version }}"

      # The installers are attached by desktop.yml after upload-assets wrote
      # SHA256SUMS.txt, so their checksums are appended here — after the verify
      # step confirmed both installers are present (every other asset writer has
      # finished by then) and before the release goes public.
      - name: Add installer checksums to SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          # Not GITHUB_REPOSITORY: that is reserved and a workflow cannot
          # override it, so it always names the repository running the job.
          PUBLISH_REPO: ${{ env.PUBLISH_REPO }}
        run: bash scripts/attach-installer-checksums.sh "${{ needs.create-release.outputs.version }}"

      # Signed here rather than in upload-assets because the installer lines are
      # appended above: this is the first moment SHA256SUMS.txt is final. The
      # signature covers the checksum file, and the checksum file covers every
      # asset, so one keyless signature is enough to tie the release together.
      # Verify with:
      #   cosign verify-blob SHA256SUMS.txt --signature SHA256SUMS.txt.sig \
      #     --certificate SHA256SUMS.txt.pem \
      #     --certificate-identity-regexp '^https://github.com/sktelecom/bomlens/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v2.6.5

      - name: Sign the checksum file
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          TAG: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gh release download "$TAG" --repo "${{ env.PUBLISH_REPO }}" \
            --pattern 'SHA256SUMS.txt' --dir "$work" --clobber
          # --new-bundle-format=false names the artifact this release publishes:
          # a detached .sig plus the .pem, which release-assets-verify.yml and the
          # documented verify-blob command both read. cosign 3 makes the Sigstore
          # bundle the default and refuses --output-signature without it.
          cosign sign-blob --yes --new-bundle-format=false \
            --output-signature "$work/SHA256SUMS.txt.sig" \
            --output-certificate "$work/SHA256SUMS.txt.pem" \
            "$work/SHA256SUMS.txt"
          gh release upload "$TAG" --repo "${{ env.PUBLISH_REPO }}" --clobber \
            "$work/SHA256SUMS.txt.sig" "$work/SHA256SUMS.txt.pem"

      # Only now make it the public, latest release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
        run: |
          gh release edit "${{ needs.create-release.outputs.version }}" \
            --repo "${{ env.PUBLISH_REPO }}" --draft=false --latest

  summary:
    name: Release Summary
    needs: [create-release, upload-assets, docs-walkthrough, release-gate]
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","linux","bomlens-wsl"]') }}
    timeout-minutes: 5

    steps:
      - name: Generate summary
        run: |
          echo "## 🎉 Release ${{ needs.create-release.outputs.version }} Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloads" >> $GITHUB_STEP_SUMMARY
          echo "- [Linux/macOS Script](https://github.com/${{ env.PUBLISH_REPO }}/releases/download/${{ needs.create-release.outputs.version }}/bomlens-cli-linux.tar.gz)" >> $GITHUB_STEP_SUMMARY
          echo "- [Windows Script](https://github.com/${{ env.PUBLISH_REPO }}/releases/download/${{ needs.create-release.outputs.version }}/bomlens-cli-windows.zip)" >> $GITHUB_STEP_SUMMARY
          echo "- [Examples](https://github.com/${{ env.PUBLISH_REPO }}/releases/download/${{ needs.create-release.outputs.version }}/bomlens-examples-${{ needs.create-release.outputs.version }}.tar.gz)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ env.PUBLISH_OWNER }}/sbom-generator:${{ needs.create-release.outputs.version }}   # legacy alias: sbom-scanner" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
