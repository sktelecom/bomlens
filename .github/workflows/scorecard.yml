name: Scorecard supply-chain security

# OpenSSF Scorecard: scores this repo against supply-chain best practices
# (branch protection, pinned dependencies, signed releases, etc.) and uploads
# the result to the Security tab.
#
# Every other workflow here runs on self-hosted runners, but this one cannot
# follow: the results API verifies the workflow file itself and accepts only a
# single `ubuntu-latest`-class runner label with no plain `run:` steps, so a
# self-hosted label makes it reject the upload. This job already satisfies
# both conditions (runs-on: ubuntu-latest, every step is `uses:`), and the
# automatic triggers below were confirmed to publish successfully end to end
# before being turned on.
on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 1'   # weekly, Monday 05:41 UTC
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write   # publish results to the OpenSSF API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
