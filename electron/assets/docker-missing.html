<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BomLens</title>
    <!-- Shared design tokens: see the note at the top of status.html. -->
    <link rel="stylesheet" href="bomlens-tokens.css" />
    <link rel="stylesheet" href="../../docker/shared/bomlens-tokens.css" />
    <style>
      :root {
        color-scheme: light dark;
        /* Fallback palette, used only when the token CSS did not load. */
        --s-bg: #f5f5f7;
        --s-fg: #1c1c21;
        --s-muted: #6b6b74;
        --s-card: #ffffff;
        --s-border: #d9d9de;
        --s-code-bg: #ececf0;
        --s-brand: #ea002c;
        --s-brand-fg: #ffffff;
        --s-ring: #ea002c;
        --s-danger: #b91c1c;
        --s-link: #1d4ed8;
        --s-fs-title: 1.25rem;
        --s-fs-body: 1rem;
        --s-fs-sm: 0.875rem;
        --s-fs-label: 0.75rem;
        --s-fs-mono: 0.75rem;
      }
      :root.dark {
        --s-bg: #0a0a0c;
        --s-fg: #e7e7ea;
        --s-muted: #9a9aa2;
        --s-card: #131316;
        --s-border: #26262b;
        --s-code-bg: #1c1c21;
        --s-ring: #ff5c7c;
        --s-danger: #fca5a5;
        --s-link: #93c5fd;
      }
      :root.tokens {
        --s-bg: hsl(var(--background));
        --s-fg: hsl(var(--foreground));
        --s-muted: hsl(var(--muted-foreground));
        --s-card: hsl(var(--card));
        --s-border: hsl(var(--border));
        --s-code-bg: hsl(var(--muted));
        --s-brand: hsl(var(--brand));
        --s-brand-fg: hsl(var(--brand-foreground));
        --s-ring: hsl(var(--ring));
        --s-danger: rgb(var(--role-danger-fg));
        --s-link: rgb(var(--role-info-fg));
        --s-fs-title: var(--font-size-title);
        --s-fs-body: var(--font-size-body);
        --s-fs-sm: var(--font-size-body-sm);
        --s-fs-label: var(--font-size-label);
        --s-fs-mono: var(--font-size-mono);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
        font-size: var(--s-fs-body);
        background: var(--s-bg);
        color: var(--s-fg);
      }
      :focus-visible {
        outline: 2px solid var(--s-ring);
        outline-offset: 2px;
      }
      #lang-toggle {
        position: fixed;
        top: 16px;
        right: 24px;
        font-size: var(--s-fs-label);
        color: var(--s-muted);
        user-select: none;
      }
      #lang-toggle button {
        padding: 4px 6px;
        font: inherit;
        font-weight: 600;
        color: var(--s-muted);
        background: none;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #lang-toggle button:disabled {
        color: var(--s-fg);
        cursor: default;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 40px 32px 72px;
      }
      .logo {
        display: block;
        height: 40px;
        width: auto;
      }
      h1 {
        margin: 28px 0 8px;
        font-size: var(--s-fs-title);
        font-weight: 600;
      }
      p {
        font-size: var(--s-fs-sm);
        line-height: 1.7;
        color: var(--s-fg);
      }
      ul {
        padding-left: 18px;
        font-size: var(--s-fs-sm);
        line-height: 1.8;
        color: var(--s-fg);
      }
      a {
        color: var(--s-link);
      }
      code {
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: var(--s-fs-mono);
        background: var(--s-code-bg);
        border: 1px solid var(--s-border);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .hint {
        margin-top: 20px;
        color: var(--s-muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      .btn {
        padding: 8px 16px;
        font: inherit;
        font-size: var(--s-fs-sm);
        font-weight: 600;
        color: var(--s-fg);
        background: var(--s-card);
        border: 1px solid var(--s-border);
        border-radius: 6px;
        cursor: pointer;
      }
      /* Brand red is reserved for the one primary action, the logo and the focus ring. */
      .btn.primary {
        color: var(--s-brand-fg);
        background: var(--s-brand);
        border-color: transparent;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #feedback {
        min-height: 1.4em;
        margin: 10px 0 0;
        font-size: var(--s-fs-sm);
        color: var(--s-danger);
        visibility: hidden;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin-top: 28px;
        font-size: var(--s-fs-label);
        color: var(--s-muted);
      }
      footer a {
        color: var(--s-muted);
      }
      footer a:hover {
        color: var(--s-fg);
      }
    </style>
    <script>
      // Runs after the token links have loaded: detect the tokens, follow the OS theme.
      (function () {
        var root = document.documentElement;
        if (getComputedStyle(root).getPropertyValue("--background").trim()) {
          root.classList.add("tokens");
        }
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          root.classList.toggle("dark", mq.matches);
        }
        apply();
        if (mq.addEventListener) mq.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <nav id="lang-toggle" aria-label="Language">
      <button type="button" data-lang="ko">KO</button>|<button type="button" data-lang="en">EN</button>
    </nav>
    <main>
      <img class="logo" src="logo.svg" alt="BomLens: SBOM Generator" />
      <h1 id="title"></h1>
      <p id="lead"></p>
      <p id="intro"></p>
      <ul id="options"></ul>
      <p class="hint" id="hint"></p>
      <div class="actions">
        <button id="check-again" class="btn primary" type="button"></button>
        <button id="open-logs" class="btn" type="button"></button>
      </div>
      <p id="feedback" role="status"></p>
      <footer>
        <span id="version"></span>
        <a id="report" target="_blank" rel="noreferrer noopener" href="https://github.com/sktelecom/bomlens/issues/new?template=bug_report.yml"></a>
      </footer>
    </main>
    <script>
      // 언어는 main.mjs가 ?lang= 쿼리로, OS는 ?platform=(process.platform 값)으로 넘긴다.
      const params = new URLSearchParams(location.search);
      const lang = params.get("lang") === "ko" ? "ko" : "en";
      const reason = params.get("reason");
      // 알 수 없는 platform은 win32 안내로 폴백한다(주 배포 대상이 Windows).
      const rawPlatform = params.get("platform");
      const platform = ["win32", "darwin", "linux"].includes(rawPlatform) ? rawPlatform : "win32";
      document.documentElement.lang = lang;

      // 앱 버전은 main.mjs가 ?v= 쿼리로 넘긴다. 파일을 직접 열어 쿼리가 없으면 표시하지 않는다.
      const version = params.get("v");
      if (version) document.getElementById("version").textContent = `BomLens v${version}`;

      // 언어 토글: lang 쿼리만 바꾸고 나머지 쿼리(reason, platform, v)는 보존한 채
      // 같은 화면을 다시 연다. 현재 언어 버튼은 비활성으로 표시한다.
      for (const button of document.querySelectorAll("#lang-toggle button")) {
        if (button.dataset.lang === lang) {
          button.disabled = true;
        } else {
          button.addEventListener("click", () => {
            const next = new URLSearchParams(location.search);
            next.set("lang", button.dataset.lang);
            location.replace(`${location.pathname}?${next}`);
          });
        }
      }

      const STR = {
        ko: {
          title: "Docker가 필요합니다",
          titleNotRunning: "Docker 엔진을 켜 주세요",
          titleWsl2Only: "이 앱은 WSL2의 Docker를 사용할 수 없습니다",
          leadNotRunning:
            "Docker는 설치되어 있지만 엔진이 실행 중이 아닙니다. Rancher Desktop 또는 Docker Desktop을 켜고 아이콘이 안정될 때까지 기다린 뒤 다시 확인을 눌러 주세요.",
          leadNotRunningLinux:
            "Docker는 설치되어 있지만 엔진이 실행 중이 아닙니다. sudo systemctl start docker로 엔진을 켠 뒤 다시 확인을 눌러 주세요.",
          leadNotInstalled: "Docker가 설치되어 있지 않거나 PATH에서 찾을 수 없습니다.",
          leadWsl2Only:
            "WSL2 안에서 Docker가 실행 중인 것은 확인했지만, 이 데스크톱 앱은 WSL2의 Docker에 연결하는 방법을 아직 지원하지 않습니다. 대신 WSL2 터미널에서 CLI로 실행해 주세요.",
          wsl2Cli: "wsl을 실행한 뒤 저장소 폴더에서:",
          intro: {
            win32: "BomLens는 스캐너를 Docker 컨테이너로 실행합니다. Windows에서 쓸 수 있는 무료 옵션:",
            darwin: "BomLens는 스캐너를 Docker 컨테이너로 실행합니다. macOS에서 쓸 수 있는 옵션:",
            linux: "BomLens는 스캐너를 Docker 컨테이너로 실행합니다. Linux에서는 Docker Engine을 설치하면 됩니다:",
          },
          report: "문제 신고",
          hint: "설치하고 엔진을 켠 뒤 다시 확인을 눌러 주세요.",
          checkAgain: "다시 확인",
          openLogs: "로그 폴더 열기",
          stillMissing: "아직 Docker를 찾을 수 없습니다. 엔진이 켜져 있는지 확인해 주세요.",
        },
        en: {
          title: "Docker is required",
          titleNotRunning: "Please start the Docker engine",
          titleWsl2Only: "This app can't use Docker inside WSL2",
          leadNotRunning:
            "Docker is installed but the engine isn't running. Start Rancher Desktop or Docker Desktop, wait until the icon settles, then press Check again.",
          leadNotRunningLinux:
            "Docker is installed but the engine isn't running. Start it with sudo systemctl start docker, then press Check again.",
          leadNotInstalled: "Docker isn't installed or can't be found on your PATH.",
          leadWsl2Only:
            "Docker is running inside WSL2, but this desktop app doesn't yet know how to reach it. Run BomLens from the CLI inside WSL2 instead.",
          wsl2Cli: "Open wsl, then from the repository folder:",
          intro: {
            win32: "BomLens runs the scanner as a Docker container. Free options on Windows:",
            darwin: "BomLens runs the scanner as a Docker container. Options on macOS:",
            linux: "BomLens runs the scanner as a Docker container. On Linux, install Docker Engine:",
          },
          report: "Report a problem",
          hint: "Install it, start the engine, then press Check again.",
          checkAgain: "Check again",
          openLogs: "Open log folder",
          stillMissing: "Still can't find Docker. Make sure the engine is running.",
        },
      };

      // OS별 설치 옵션. name/url/cmd는 언어와 무관하게 고정하고 설명만 번역한다.
      const OPTIONS = {
        win32: [
          {
            url: "https://rancherdesktop.io/",
            name: "Rancher Desktop",
            desc: {
              ko: "GUI, 이 앱에서 바로 사용 가능(권장)",
              en: "GUI, works with this app out of the box (recommended)",
            },
          },
          {
            url: "https://docs.docker.com/engine/install/",
            name: "WSL2 + docker-ce",
            desc: {
              ko: "완전 무료. CLI 전용이라 이 데스크톱 앱에서는 사용할 수 없음",
              en: "completely free, CLI only, does not work with this desktop app",
            },
          },
          {
            url: "https://www.docker.com/products/docker-desktop/",
            name: "Docker Desktop",
            desc: {
              ko: "규모가 큰 조직은 유료 라이선스 필요",
              en: "larger organizations need a paid license",
            },
          },
        ],
        darwin: [
          {
            url: "https://www.docker.com/products/docker-desktop/",
            name: "Docker Desktop",
            desc: {
              ko: "가장 간단한 설치, 규모가 큰 조직은 유료 라이선스 필요",
              en: "the simplest setup; larger organizations need a paid license",
            },
          },
          {
            url: "https://github.com/abiosoft/colima",
            name: "Colima",
            desc: {
              ko: ["완전 무료. 설치: ", { code: "brew install colima docker" }, ", 실행: ", { code: "colima start" }],
              en: [
                "completely free. Install: ",
                { code: "brew install colima docker" },
                ", then run: ",
                { code: "colima start" },
              ],
            },
          },
        ],
        linux: [
          {
            url: "https://docs.docker.com/engine/install/",
            name: "Docker Engine",
            desc: {
              ko: "배포판별 설치 안내(docs.docker.com/engine/install)",
              en: "per-distribution install guide (docs.docker.com/engine/install)",
            },
          },
          {
            name: "sudo systemctl start docker",
            code: true,
            desc: { ko: "설치 후 엔진 시작", en: "start the engine after installing" },
          },
          {
            name: "sudo usermod -aG docker $USER",
            code: true,
            desc: {
              ko: "다시 로그인하면 sudo 없이 사용할 수 있습니다",
              en: "log out and back in to use Docker without sudo",
            },
          },
        ],
      };

      const s = STR[lang];
      document.getElementById("report").textContent = s.report;

      document.getElementById("title").textContent =
        reason === "not-running" ? s.titleNotRunning : reason === "wsl2-only" ? s.titleWsl2Only : s.title;
      document.getElementById("lead").textContent =
        reason === "not-running"
          ? platform === "linux"
            ? s.leadNotRunningLinux
            : s.leadNotRunning
          : reason === "wsl2-only"
            ? s.leadWsl2Only
            : s.leadNotInstalled;

      // wsl2-only: 설치 옵션 목록(이 앱에는 안 맞는 항목들 포함)을 보여주는 대신 CLI 명령
      // 한 줄만 안내한다 — 이 경우엔 "무엇을 설치할지"가 아니라 "어떻게 실행할지"가 문제다.
      if (reason === "wsl2-only") {
        document.getElementById("intro").textContent = s.wsl2Cli;
        const list = document.getElementById("options");
        const li = document.createElement("li");
        const code = document.createElement("code");
        code.textContent = "./scripts/scan-sbom.sh --ui";
        li.appendChild(code);
        list.appendChild(li);
        document.getElementById("hint").textContent = "";
      } else {
        document.getElementById("intro").textContent = s.intro[platform];
        document.getElementById("hint").textContent = s.hint;

        // 옵션 목록 렌더: 링크가 있으면 <a>, 명령어면 <code>, 설명은 ": "로 잇는다. desc는
        // 보통 문자열이지만, 문장 중간에 <code>로 감싸야 할 명령이 있으면 문자열과
        // {code: "..."} 조각을 섞은 배열이다(Colima의 설치/실행 명령 참고).
        const list = document.getElementById("options");
        for (const opt of OPTIONS[platform]) {
          const li = document.createElement("li");
          let label;
          if (opt.url) {
            label = document.createElement("a");
            label.href = opt.url;
            label.textContent = opt.name;
          } else {
            label = document.createElement(opt.code ? "code" : "span");
            label.textContent = opt.name;
          }
          li.appendChild(label);
          li.appendChild(document.createTextNode(": "));
          const descParts = Array.isArray(opt.desc[lang]) ? opt.desc[lang] : [opt.desc[lang]];
          for (const part of descParts) {
            if (typeof part === "object" && part.code) {
              const code = document.createElement("code");
              code.textContent = part.code;
              li.appendChild(code);
            } else {
              li.appendChild(document.createTextNode(part));
            }
          }
          list.appendChild(li);
        }
      }

      // "다시 확인": main이 Docker를 재점검한다. 성공하면 main이 상태 화면으로 전환하고,
      // 여전히 없으면(ok:false) 피드백 한 줄을 몇 초 보여준다.
      const checkAgain = document.getElementById("check-again");
      const feedback = document.getElementById("feedback");
      checkAgain.textContent = s.checkAgain;
      const openLogs = document.getElementById("open-logs");
      openLogs.textContent = s.openLogs;
      openLogs.addEventListener("click", () => {
        if (window.sbomDesktop && window.sbomDesktop.openLogs) window.sbomDesktop.openLogs();
      });
      let feedbackTimer = null;
      checkAgain.addEventListener("click", async () => {
        checkAgain.disabled = true;
        const result =
          window.sbomDesktop && window.sbomDesktop.retryStartup
            ? await window.sbomDesktop.retryStartup()
            : { ok: false };
        if (!result || !result.ok) {
          // 사유가 바뀌었으면(예: 재확인 사이에 WSL2 Docker가 새로 감지됨) 토스트 대신
          // 화면 전체를 새 사유로 다시 연다 — 안내 문구·옵션 목록이 사유에 따라 다르다.
          if (result && result.reason && result.reason !== reason) {
            const next = new URLSearchParams(location.search);
            next.set("reason", result.reason);
            location.replace(`${location.pathname}?${next}`);
            return;
          }
          checkAgain.disabled = false;
          feedback.textContent = s.stillMissing;
          feedback.style.visibility = "visible";
          clearTimeout(feedbackTimer);
          feedbackTimer = setTimeout(() => {
            feedback.style.visibility = "hidden";
          }, 4000);
        }
      });
    </script>
  </body>
</html>
