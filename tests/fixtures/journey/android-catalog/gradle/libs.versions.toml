[versions]
agp = "8.5.2"
android-compileSdk = "37"
android-minSdk = "23"
androidx-core = "1.13.1"
okhttp = "4.12.0"
junit = "4.13.2"
kotlin = "2.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version = "4.12.0" }
junit = { module = "junit:junit", version.ref = "junit" }
gson = "com.google.code.gson:gson:2.10.1"
timber = { module = "com.jakewharton.timber:timber", version = { strictly = "5.0.1" } }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
no-version = { module = "org.example:managed-by-bom" }

[bundles]
networking = ["okhttp", "okhttp-logging"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
