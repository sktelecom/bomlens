[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bomlens-runner"
dynamic = ["version"]
description = "Run the BomLens SBOM scan engine on Kubernetes or Docker from another program"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "SK Telecom" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sktelecom/bomlens"
Documentation = "https://sktelecom.github.io/bomlens/reference/engine-runner/"

[project.scripts]
bomlens-runner = "bomlens_runner.cli:main"

[tool.setuptools.dynamic]
version = { attr = "bomlens_runner._release.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
