# gitleaks configuration for the CI secret scan (.github/workflows/ci.yml) and
# the weekly full-history sweep (.github/workflows/nightly.yml).
#
# The default rule set is kept in full; the entries below only describe what is
# known not to be a credential.

[extend]
useDefault = true

[allowlist]
description = "Build-time secret declarations name a secret; they never carry its value"
regexTarget = "line"
regexes = [
  # `docker build --secret id=<name>,env=<VAR>` and the docs that quote it.
  # BuildKit resolves the value at build time from the environment, so the
  # string that appears in a Dockerfile or a README is a name pair, not a key.
  '''id=[A-Za-z0-9_-]+,env=[A-Za-z0-9_]+''',
]
# The demo's security reports are Trivy output: public CVE records whose
# references and descriptions quote upstream commit hashes, and a 40-digit
# hex hash has the shape of a legacy Sourcegraph token (56,350 such matches
# in one firmware report). No credential is ever written there.
paths = [
  # docs/demo on main; demo/ at the root of the published demo site's branch.
  '''^(docs/)?demo/data/files/[^/]+/[^/]+_security\.json$''',
]
